workflows:
  ios-release:
    name: iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_connect
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.jessocial.app
    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps
      - name: Patch apple-sign-in SPM version conflict
        script: |
          sed -i '' 's/from: "7\.0\.0"/from: "8.0.0"/' node_modules/@capacitor-community/apple-sign-in/Package.swift
          echo "Patched apple-sign-in Package.swift:"
          grep "capacitor-swift-pm" node_modules/@capacitor-community/apple-sign-in/Package.swift
      - name: Swap pages for mobile build
        script: node scripts/swap-mobile-pages.js
      - name: Verify swap
        script: |
          echo "=== app/post/[id]/page.tsx after swap ===" && cat "app/post/[id]/page.tsx"
          echo "=== app/profile/[username]/page.tsx after swap ===" && cat "app/profile/[username]/page.tsx"
      - name: Build Next.js static export
        script: MOBILE_BUILD=true npx next build --webpack
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Generate iOS app icons
        script: |
          sips -z 1024 1024 icon.png --out icon_1024.png
          APPICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          sips -z 20 20     icon_1024.png --out "$APPICONSET/AppIcon-20x20@1x.png"
          sips -z 40 40     icon_1024.png --out "$APPICONSET/AppIcon-20x20@2x.png"
          sips -z 60 60     icon_1024.png --out "$APPICONSET/AppIcon-20x20@3x.png"
          sips -z 29 29     icon_1024.png --out "$APPICONSET/AppIcon-29x29@1x.png"
          sips -z 58 58     icon_1024.png --out "$APPICONSET/AppIcon-29x29@2x.png"
          sips -z 87 87     icon_1024.png --out "$APPICONSET/AppIcon-29x29@3x.png"
          sips -z 40 40     icon_1024.png --out "$APPICONSET/AppIcon-40x40@1x.png"
          sips -z 80 80     icon_1024.png --out "$APPICONSET/AppIcon-40x40@2x.png"
          sips -z 120 120   icon_1024.png --out "$APPICONSET/AppIcon-40x40@3x.png"
          sips -z 120 120   icon_1024.png --out "$APPICONSET/AppIcon-60x60@2x.png"
          sips -z 180 180   icon_1024.png --out "$APPICONSET/AppIcon-60x60@3x.png"
          sips -z 76 76     icon_1024.png --out "$APPICONSET/AppIcon-76x76@1x.png"
          sips -z 152 152   icon_1024.png --out "$APPICONSET/AppIcon-76x76@2x.png"
          sips -z 167 167   icon_1024.png --out "$APPICONSET/AppIcon-83.5x83.5@2x.png"
          sips -z 1024 1024 icon_1024.png --out "$APPICONSET/AppIcon-1024x1024@1x.png"
          cat > "$APPICONSET/Contents.json" << 'EOF'
          {
            "images": [
              {"idiom":"iphone","scale":"1x","size":"20x20","filename":"AppIcon-20x20@1x.png"},
              {"idiom":"iphone","scale":"2x","size":"20x20","filename":"AppIcon-20x20@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"20x20","filename":"AppIcon-20x20@3x.png"},
              {"idiom":"iphone","scale":"1x","size":"29x29","filename":"AppIcon-29x29@1x.png"},
              {"idiom":"iphone","scale":"2x","size":"29x29","filename":"AppIcon-29x29@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"29x29","filename":"AppIcon-29x29@3x.png"},
              {"idiom":"iphone","scale":"1x","size":"40x40","filename":"AppIcon-40x40@1x.png"},
              {"idiom":"iphone","scale":"2x","size":"40x40","filename":"AppIcon-40x40@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"40x40","filename":"AppIcon-40x40@3x.png"},
              {"idiom":"iphone","scale":"2x","size":"60x60","filename":"AppIcon-60x60@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"60x60","filename":"AppIcon-60x60@3x.png"},
              {"idiom":"ipad","scale":"1x","size":"20x20","filename":"AppIcon-20x20@1x.png"},
              {"idiom":"ipad","scale":"2x","size":"20x20","filename":"AppIcon-20x20@2x.png"},
              {"idiom":"ipad","scale":"1x","size":"29x29","filename":"AppIcon-29x29@1x.png"},
              {"idiom":"ipad","scale":"2x","size":"29x29","filename":"AppIcon-29x29@2x.png"},
              {"idiom":"ipad","scale":"1x","size":"40x40","filename":"AppIcon-40x40@1x.png"},
              {"idiom":"ipad","scale":"2x","size":"40x40","filename":"AppIcon-40x40@2x.png"},
              {"idiom":"ipad","scale":"1x","size":"76x76","filename":"AppIcon-76x76@1x.png"},
              {"idiom":"ipad","scale":"2x","size":"76x76","filename":"AppIcon-76x76@2x.png"},
              {"idiom":"ipad","scale":"2x","size":"83.5x83.5","filename":"AppIcon-83.5x83.5@2x.png"},
              {"idiom":"ios-marketing","scale":"1x","size":"1024x1024","filename":"AppIcon-1024x1024@1x.png"}
            ],
            "info": {"author":"xcode","version":1}
          }
          EOF
      - name: Copy GoogleService-Info.plist
        script: cp GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
          echo "=== Provisioning profiles installed ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "No profiles found"
          echo "=== xcodeproj CODE_SIGN after use-profiles ==="
          grep -E "CODE_SIGN_STYLE|PROVISIONING_PROFILE|DEVELOPMENT_TEAM" ios/App/App.xcodeproj/project.pbxproj || echo "Nothing found"
      - name: Resolve SPM packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App
      - name: Build IPA
        script: |
          echo "=== Provisioning profiles ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "NO PROFILES FOUND"
          echo "=== Certificate identities ==="
          security find-identity -v -p codesigning 2>/dev/null || echo "NO CERTS"
          echo "=== xcodeproj signing settings ==="
          grep -E "CODE_SIGN_STYLE|PROVISIONING_PROFILE|DEVELOPMENT_TEAM" ios/App/App.xcodeproj/project.pbxproj || echo "NOTHING"
          echo "=== Building ==="
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

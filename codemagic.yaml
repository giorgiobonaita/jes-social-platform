workflows:
  ios-release:
    name: iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_connect
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.jessocial.app
    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps
      - name: Patch apple-sign-in SPM version conflict
        script: |
          sed -i '' 's/from: "7\.0\.0"/from: "8.0.0"/' node_modules/@capacitor-community/apple-sign-in/Package.swift
          echo "Patched apple-sign-in Package.swift:"
          grep "capacitor-swift-pm" node_modules/@capacitor-community/apple-sign-in/Package.swift
      - name: Swap pages for mobile build
        script: node scripts/swap-mobile-pages.js
      - name: Verify swap
        script: |
          echo "=== app/post/[id]/page.tsx after swap ===" && cat "app/post/[id]/page.tsx"
          echo "=== app/profile/[username]/page.tsx after swap ===" && cat "app/profile/[username]/page.tsx"
      - name: Build Next.js static export
        script: MOBILE_BUILD=true npx next build --webpack
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Copy GoogleService-Info.plist
        script: cp GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Resolve SPM packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

workflows:
  ios-release:
    name: iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_connect
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.jes.social
    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps
      - name: Patch apple-sign-in SPM version conflict
        script: |
          sed -i '' 's/from: "7\.0\.0"/from: "8.0.0"/' node_modules/@capacitor-community/apple-sign-in/Package.swift
          echo "Patched apple-sign-in Package.swift:"
          grep "capacitor-swift-pm" node_modules/@capacitor-community/apple-sign-in/Package.swift
      - name: Swap pages for mobile build
        script: node scripts/swap-mobile-pages.js
      - name: Verify swap
        script: |
          echo "=== app/post/[id]/page.tsx after swap ===" && cat "app/post/[id]/page.tsx"
          echo "=== app/profile/[username]/page.tsx after swap ===" && cat "app/profile/[username]/page.tsx"
      - name: Build Next.js static export
        script: |
          export NEXT_PUBLIC_SUPABASE_URL="https://cunftokrdqvprepcnlum.supabase.co"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1bmZ0b2tyZHF2cHJlcGNubHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MDY0ODIsImV4cCI6MjA5MDk4MjQ4Mn0.MbzysRQTEvNXWQKgE84ThglSZSnOlDu_vyD1JF8WdC4"
          MOBILE_BUILD=true npx next build --webpack
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Fix bundle ID in Xcode project
        script: |
          sed -i '' 's/com\.jessocial\.app/com.jes.social/g' ios/App/App.xcodeproj/project.pbxproj
      - name: Configure Sign in with Apple + Google Sign In
        script: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          PLIST="ios/App/App/Info.plist"
          python3 scripts/fix_xcode.py "$PBXPROJ"
          if ! grep -q "com.googleusercontent.apps" "$PLIST"; then
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.googleusercontent.apps.150769005493-1qd5qi8kclhgvmn1tnalqbu0hoct5t2h" "$PLIST" 2>/dev/null || true
          fi
      - name: Set build number
        script: |
          PLIST=$(find ios/App -name Info.plist | grep -v test | head -1)
          echo "Plist: $PLIST"
          echo "Build number: $BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
      - name: Generate iOS app icons
        script: |
          sips -z 1024 1024 icon.png --out icon_1024.png
          APPICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          sips -z 20 20     icon_1024.png --out "$APPICONSET/AppIcon-20x20@1x.png"
          sips -z 40 40     icon_1024.png --out "$APPICONSET/AppIcon-20x20@2x.png"
          sips -z 60 60     icon_1024.png --out "$APPICONSET/AppIcon-20x20@3x.png"
          sips -z 29 29     icon_1024.png --out "$APPICONSET/AppIcon-29x29@1x.png"
          sips -z 58 58     icon_1024.png --out "$APPICONSET/AppIcon-29x29@2x.png"
          sips -z 87 87     icon_1024.png --out "$APPICONSET/AppIcon-29x29@3x.png"
          sips -z 40 40     icon_1024.png --out "$APPICONSET/AppIcon-40x40@1x.png"
          sips -z 80 80     icon_1024.png --out "$APPICONSET/AppIcon-40x40@2x.png"
          sips -z 120 120   icon_1024.png --out "$APPICONSET/AppIcon-40x40@3x.png"
          sips -z 120 120   icon_1024.png --out "$APPICONSET/AppIcon-60x60@2x.png"
          sips -z 180 180   icon_1024.png --out "$APPICONSET/AppIcon-60x60@3x.png"
          sips -z 76 76     icon_1024.png --out "$APPICONSET/AppIcon-76x76@1x.png"
          sips -z 152 152   icon_1024.png --out "$APPICONSET/AppIcon-76x76@2x.png"
          sips -z 167 167   icon_1024.png --out "$APPICONSET/AppIcon-83.5x83.5@2x.png"
          sips -z 1024 1024 icon_1024.png --out "$APPICONSET/AppIcon-1024x1024@1x.png"
          cat > "$APPICONSET/Contents.json" << 'EOF'
          {
            "images": [
              {"idiom":"iphone","scale":"1x","size":"20x20","filename":"AppIcon-20x20@1x.png"},
              {"idiom":"iphone","scale":"2x","size":"20x20","filename":"AppIcon-20x20@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"20x20","filename":"AppIcon-20x20@3x.png"},
              {"idiom":"iphone","scale":"1x","size":"29x29","filename":"AppIcon-29x29@1x.png"},
              {"idiom":"iphone","scale":"2x","size":"29x29","filename":"AppIcon-29x29@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"29x29","filename":"AppIcon-29x29@3x.png"},
              {"idiom":"iphone","scale":"1x","size":"40x40","filename":"AppIcon-40x40@1x.png"},
              {"idiom":"iphone","scale":"2x","size":"40x40","filename":"AppIcon-40x40@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"40x40","filename":"AppIcon-40x40@3x.png"},
              {"idiom":"iphone","scale":"2x","size":"60x60","filename":"AppIcon-60x60@2x.png"},
              {"idiom":"iphone","scale":"3x","size":"60x60","filename":"AppIcon-60x60@3x.png"},
              {"idiom":"ipad","scale":"1x","size":"20x20","filename":"AppIcon-20x20@1x.png"},
              {"idiom":"ipad","scale":"2x","size":"20x20","filename":"AppIcon-20x20@2x.png"},
              {"idiom":"ipad","scale":"1x","size":"29x29","filename":"AppIcon-29x29@1x.png"},
              {"idiom":"ipad","scale":"2x","size":"29x29","filename":"AppIcon-29x29@2x.png"},
              {"idiom":"ipad","scale":"1x","size":"40x40","filename":"AppIcon-40x40@1x.png"},
              {"idiom":"ipad","scale":"2x","size":"40x40","filename":"AppIcon-40x40@2x.png"},
              {"idiom":"ipad","scale":"1x","size":"76x76","filename":"AppIcon-76x76@1x.png"},
              {"idiom":"ipad","scale":"2x","size":"76x76","filename":"AppIcon-76x76@2x.png"},
              {"idiom":"ipad","scale":"2x","size":"83.5x83.5","filename":"AppIcon-83.5x83.5@2x.png"},
              {"idiom":"ios-marketing","scale":"1x","size":"1024x1024","filename":"AppIcon-1024x1024@1x.png"}
            ],
            "info": {"author":"xcode","version":1}
          }
          EOF
      - name: Copy GoogleService-Info.plist
        script: cp GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID \
            --type IOS_APP_STORE \
            --create \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY"
          keychain add-certificates
          # Copy profiles to MobileDevice location for Xcode
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          find ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/ -name "*.mobileprovision" \
            -exec cp {} ~/Library/MobileDevice/Provisioning\ Profiles/ \; 2>/dev/null || true
          xcode-project use-profiles || true
          echo "=== Profiles ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "none"
      - name: Resolve SPM packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App
      - name: Build IPA
        script: |
          TEAM_ID="AA9JL76G8A"
          PROFILE=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
          PROFILE_UUID=$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -)
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile path: $PROFILE"
          security find-identity -v -p codesigning

          ARCHIVE_PATH="/tmp/App.xcarchive"
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            COMPILER_INDEX_STORE_ENABLE=NO

          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
